<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VideoFrame · 本地视频智能筛选工作台</title><link rel="stylesheet" href="/style.css"><body><aside><div class="brand"><b>VF</b><div><strong>VideoFrame</strong><small>本地视频智能筛选工作台</small></div></div><section class="directory"><small>当前目录</small><h4 id="dirname">尚未选择目录</h4><p id="dirpath">导入本地视频开始分析</p><button class="link" id="choose">切换目录</button></section><nav><button data-page="videos"><i>01</i><span>视频列表<small>扫描与抽帧</small></span><em id="nvideo">0</em></button><button data-page="gallery" class="active"><i>02</i><span>宫格图列表<small>结果与收藏</small></span><em id="nsheet">0</em></button><button data-page="analysis"><i>03</i><span>分析中心<small>AI 批量筛选</small></span><em id="nhit">0</em></button></nav><footer><div id="ffmpeg">● 检查 FFmpeg</div><p>目录数据自动保存<br>分析记录自动恢复</p></footer></aside><main><header><div><small>工作区 / <span id="crumb">结果</span></small><h1 id="title">宫格图列表</h1><p id="subtitle">查看、筛选和收藏已经生成的 16 宫格图片</p></div><div class="metrics" id="metrics"></div></header><div class="status" id="status">加载中…</div><div id="content"></div></main><dialog id="viewer"><button id="close">✕</button><div class="frame-preview"><img id="large" alt="视频宫格"><div id="frame-grid"></div></div><p class="note">点击任一有效格子，从该帧前 5 秒开始回看。紫色标记为 AI 命中。</p><div id="details"></div><section id="playback" hidden><h3 id="playback-title"></h3><p id="playback-position"></p><video id="video-player" controls playsinline preload="metadata"></video><div class="actions"><label>播放速度 <select id="playback-rate"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option><option value="4">4×</option></select></label><button id="replay-frame">重新回看此帧</button></div><p id="playback-error" role="status"></p></section><button id="reveal">在 Finder 中显示原视频</button></dialog><div id="toast"></div><script src="/player.js"></script><script src="/app.js"></script></body></html>
